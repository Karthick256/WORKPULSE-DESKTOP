name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Get version from tag or commit count
        id: version
        shell: pwsh
        run: |
          $tag = git describe --tags --abbrev=0 2>$null
          if ($tag) {
            $version = $tag.TrimStart('v')
            echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            echo "TAG_EXISTS=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            $count = (git rev-list --count HEAD)
            $version = "1.0.$count"
            echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            echo "TAG_EXISTS=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          Write-Host "Version: $version"

      - name: Update csproj version
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $csprojPath = "monitor_desktop.csproj"
          
          Write-Host "Setting version to: $version"
          
          # Read the csproj file
          $content = Get-Content $csprojPath -Raw
          
          # Create replacement strings separately to avoid PowerShell parsing issues
          $versionTag = "<Version>$version</Version>"
          $assemblyVersionTag = "<AssemblyVersion>$version.0</AssemblyVersion>"
          $fileVersionTag = "<FileVersion>$version.0</FileVersion>"
          
          # Replace version tags
          $content = $content -replace '<Version>.*?</Version>', $versionTag
          $content = $content -replace '<AssemblyVersion>.*?</AssemblyVersion>', $assemblyVersionTag
          $content = $content -replace '<FileVersion>.*?</FileVersion>', $fileVersionTag
          
          # Save the updated content
          [System.IO.File]::WriteAllText($csprojPath, $content)
          
          Write-Host "Updated csproj with version $version"
          
          # Display the updated version lines for verification
          Get-Content $csprojPath | Select-String -Pattern "Version|AssemblyVersion|FileVersion"

      - name: Restore dependencies
        run: dotnet restore monitor_desktop.csproj

      - name: Build and Publish
        run: |
          dotnet publish monitor_desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o publish/

      - name: List publish contents
        shell: pwsh
        run: |
          Get-ChildItem publish/ -Recurse | Select-Object FullName, Length

      - name: Create ZIP Archive
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          Compress-Archive -Path publish/* -DestinationPath "WorkPulse-v$version.zip"
          Write-Host "Created WorkPulse-v$version.zip"

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.VERSION }}"
          name: "WorkPulse v${{ steps.version.outputs.VERSION }}"
          files: "WorkPulse-v${{ steps.version.outputs.VERSION }}.zip"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}