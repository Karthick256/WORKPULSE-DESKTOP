name: Build and Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Get latest version
        id: version
        shell: pwsh
        run: |
          # Get all existing tags
          $tags = git tag -l "v*" | ForEach-Object { $_ -replace '^v', '' } | ForEach-Object { [Version]$_ }
          
          if ($tags.Count -gt 0) {
            $latestVersion = ($tags | Measure-Object -Maximum).Maximum
            $newVersion = "$($latestVersion.Major).$($latestVersion.Minor).$($latestVersion.Build + 1)"
            echo "VERSION=$newVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            echo "TAG_EXISTS=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            $newVersion = "1.0.1"
            echo "VERSION=$newVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            echo "TAG_EXISTS=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          Write-Host "New Version: $newVersion"

      - name: Update csproj version
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $csprojPath = "monitor_desktop.csproj"
          
          Write-Host "Setting version to: $version"
          
          $content = Get-Content $csprojPath -Raw
          
          $versionTag = "<Version>$version</Version>"
          $assemblyVersionTag = "<AssemblyVersion>$version.0</AssemblyVersion>"
          $fileVersionTag = "<FileVersion>$version.0</FileVersion>"
          
          $content = $content -replace '<Version>.*?</Version>', $versionTag
          $content = $content -replace '<AssemblyVersion>.*?</AssemblyVersion>', $assemblyVersionTag
          $content = $content -replace '<FileVersion>.*?</FileVersion>', $fileVersionTag
          
          [System.IO.File]::WriteAllText($csprojPath, $content)
          
          Write-Host "Updated csproj with version $version"

      - name: Commit version change
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add monitor_desktop.csproj
          git diff --staged --quiet || git commit -m "Bump version to ${{ steps.version.outputs.VERSION }} [skip ci]"
          git push

      - name: Restore dependencies
        run: dotnet restore monitor_desktop.csproj

      - name: Build and Publish
        run: |
          dotnet publish monitor_desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o publish/

      - name: Create ZIP Archive
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          Compress-Archive -Path publish/* -DestinationPath "WorkPulse-v$version.zip"
          Write-Host "Created WorkPulse-v$version.zip"

      - name: Create Tag and Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.VERSION }}"
          name: "WorkPulse v${{ steps.version.outputs.VERSION }}"
          files: "WorkPulse-v${{ steps.version.outputs.VERSION }}.zip"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}